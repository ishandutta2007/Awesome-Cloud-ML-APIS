<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tealGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        letter-spacing: -1px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Animated Pulses and Beams */
      @keyframes floatBeam {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes waveFloat {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }

      .floating-particle {
        animation: floatBeam 6s ease-in-out infinite;
      }
      .particle-delayed {
        animation: floatBeam 8s ease-in-out 3s infinite;
      }
      .ambient-glow {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-path {
        stroke-dasharray: 12, 16;
        animation: streamFlow 4s linear infinite;
      }
      .flow-path-reverse {
        stroke-dasharray: 8, 12;
        animation: streamFlow 5s linear infinite reverse;
      }
      .dynamic-waves {
        animation: waveFloat 10s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" />
  <rect width="1198" height="338" x="1" y="1" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Ambient Glows -->
  <circle cx="240" cy="120" r="180" fill="url(#tealGlow)" class="ambient-glow" />
  <circle cx="960" cy="200" r="220" fill="url(#glowGlow)" class="ambient-glow" />

  <!-- Background Circuit & Wave Lines (Layer 1 - behind foreground) -->
  <g opacity="0.22" class="dynamic-waves">
    <path d="M 0 100 Q 300 40 600 110 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 0 240 Q 350 310 700 230 T 1200 270" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Dynamic Animated Streaming Rays (Layer 2 - background) -->
  <path d="M -50 70 L 450 70 L 600 140 L 1250 140" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="flow-path" />
  <path d="M 1250 250 L 780 250 L 650 190 L -50 190" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.4" class="flow-path-reverse" />

  <!-- Floating Particles & Orbit Nodes (Deep Background) -->
  <g class="floating-particle">
    <circle cx="160" cy="70" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="1040" cy="90" r="4" fill="#818cf8" opacity="0.7" />
    <circle cx="880" cy="280" r="3" fill="#c084fc" opacity="0.9" />
  </g>
  <g class="particle-delayed">
    <circle cx="280" cy="290" r="3.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="1120" cy="180" r="2.5" fill="#67e8f9" opacity="0.8" />
    <circle cx="80" cy="190" r="4" fill="#a855f7" opacity="0.7" />
  </g>

  <!-- Foreground Main Title & Badges Header -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Super Header Badge -->
    <g transform="translate(0, -60)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="-120" cy="0" r="4" fill="#10b981" />
      <text x="-105" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">PRODUCTION ML &amp; GPU INFRA</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text y="15" class="text-title" fill="url(#primaryGrad)">Awesome Cloud ML APIs</text>

    <!-- Clear, Crisp Subtitle -->
    <text y="58" class="text-subtitle">Curated Directory of Serverless Model Serving &amp; GPU Inference Platforms</text>
  </g>

  <!-- Dynamic Feature Badges / Pills (Anchored at Bottom Foreground) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Serverless GPU -->
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">⚡ Serverless GPU</text>
    </g>

    <!-- Pill 2: Scale-To-Zero -->
    <g transform="translate(-195, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">📉 Scale to Zero</text>
    </g>

    <!-- Pill 3: Open-Source Serving -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🚀 High-Speed LLMs</text>
    </g>

    <!-- Pill 4: Production MLOps -->
    <g transform="translate(195, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">🛠️ Production MLOps</text>
    </g>

    <!-- Pill 5: Kubernetes Native -->
    <g transform="translate(390, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" class="pill-text">☸️ Kubernetes Native</text>
    </g>
  </g>
</svg>
